scenario_id: SCN-MODBUS-CTX-RANGE-MAINT-001
title: Out-of-range setpoint write during maintenance
description: A client writes an out-of-range setpoint during maintenance; range validation must still alert.
protocol_carrier: Modbus/TCP
api_action:
  endpoint: /api/v2/lab/write-register
  method: POST
  payload:
    register: 1
    value: 150
    unit_id: 1
protocol_operation:
  function: write_register
  target_register: 1
  value: 150
industrial_action:
  type: write_setpoint
  value: 150
automation_artefact:
  id: PUMP_FLOW_SP
  class: setpoint
  allowed_range:
    min: 0
    max: 100
  mapping_confidence: known
operational_context:
  operating_mode: maintenance
  maintenance_status: in_maintenance
  maintenance_window: true
policy_constraint:
  id: OBS-R001
  rule: write outside declared operational envelope should alert
expected_decision: ALERT
expected_rule: OBS-R001
rationale: Maintenance context must not override the declared operating envelope for mapped setpoints.
